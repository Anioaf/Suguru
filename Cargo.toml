[package]
name = "Suguru"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
fontdue = "0.9"
regex = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1"
rustc-hash = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"